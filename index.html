<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Eili-Automat">
<meta name="theme-color" content="#FFF9F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#15171A" media="(prefers-color-scheme: dark)">
<title>Barbaras Eili-Automat</title>
<style>
:root{
  --bg1:#FFF9F2; --bg2:#F2F7F3;
  --karte:#FFFFFF; --rand:rgba(30,20,10,.07);
  --schatten:0 1px 2px rgba(60,40,20,.05), 0 12px 34px -8px rgba(60,40,20,.16);
  --text:#26251F; --leise:#6E6B62;
  --ton1:#FFF2E0; --ton1r:#F3D7AE; --ton1t:#8A5A1B;
  --ton2:#E7F5EC; --ton2r:#B6DFC6; --ton2t:#1F6B3C;
  --ton3:#F1EBFC; --ton3r:#D2C3F1; --ton3t:#553A97;
  --gut:#2F8B4B; --gutbg:#E6F5EA; --gutr:#A9DCB9;
  --schlecht:#C0503A; --schlechtbg:#FBEDE9; --schlechtr:#EEC3B7;
  --r:24px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg1:#15171A; --bg2:#191B1E;
    --karte:#212428; --rand:rgba(255,255,255,.08);
    --schatten:0 1px 2px rgba(0,0,0,.4), 0 16px 40px -10px rgba(0,0,0,.6);
    --text:#EDEBE5; --leise:#9C9A93;
    --ton1:#3A2E1E; --ton1r:#5C4626; --ton1t:#F0C98A;
    --ton2:#1E3327; --ton2r:#2F5540; --ton2t:#9BD9B2;
    --ton3:#2A2440; --ton3r:#443A66; --ton3t:#C6B4F0;
    --gut:#6FD08C; --gutbg:#1D3527; --gutr:#356046;
    --schlecht:#F0917A; --schlechtbg:#3A231D; --schlechtr:#6B3A2C;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
/* Ganz gewoehnlicher Seitenaufbau, wie die Admin-Seite. Keine feste Hoehe,
   keine mittige Ausrichtung ueber ein Flexlayout. Nur so waechst das
   Dokument mit dem Inhalt, scrollt als Ganzes und laeuft beim Scrollen
   hinter die Leisten, wie man es von jeder Seite kennt.
   Dokument und Seite tragen dieselbe Farbe, damit keine Kante entsteht. */
html{background:var(--bg1)}
body{
  margin:0;background:var(--bg1);
  padding:calc(env(safe-area-inset-top) + 30px) 18px calc(env(safe-area-inset-bottom) + 36px);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif;
  color:var(--text);
  position:relative;
}
/* An der Seite haengen, nicht am Fenster. Sonst bleibt der Hintergrund
   beim Scrollen stehen, waehrend die Karte darueber hinwegwandert. */
.blasen{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blasen i{position:absolute;display:block;border-radius:50%;filter:blur(46px);opacity:.5}
.blasen i:nth-child(1){width:300px;height:300px;top:14%;left:-32%;background:#FFD59E}
.blasen i:nth-child(2){width:280px;height:280px;bottom:16%;right:-30%;background:#A8DFC0}
.blasen i:nth-child(3){width:220px;height:220px;top:52%;left:-28%;background:#D6C6F5}
.blasen{mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%);
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 16%,#000 84%,transparent 100%)}
@media (prefers-color-scheme: dark){.blasen i{opacity:.18}}

.karte{
  position:relative;z-index:1;width:100%;max-width:440px;
  margin:0 auto;
  background:var(--karte);border:1px solid var(--rand);
  border-radius:var(--r);box-shadow:var(--schatten);
  padding:34px 26px 32px;
  animation:auf .5s cubic-bezier(.2,.7,.3,1) both;
}
@keyframes auf{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}

.kopf{display:flex;align-items:center;gap:13px;margin-bottom:6px}
.kopf svg{flex:none}
h1{margin:0;font-size:1.62rem;font-weight:650;letter-spacing:-.02em;line-height:1.2}
.unter{margin:12px 0 22px;font-size:.98rem;color:var(--leise);line-height:1.55}
.status{display:inline-flex;align-items:center;gap:9px;margin:0 0 24px;
  padding:8px 15px;border-radius:99px;font-size:.84rem;font-weight:500;
  background:var(--rand);color:var(--leise);transition:background .35s,color .35s}
.status i{width:8px;height:8px;border-radius:50%;background:#B9B7B0;flex:none;
  transition:background .35s}
.status.bereit{background:var(--gutbg);color:var(--gut)}
.status.bereit i{background:var(--gut);animation:puls 2.4s infinite}
.status.weg{background:var(--schlechtbg);color:var(--schlecht)}
.status.weg i{background:var(--schlecht)}
@keyframes puls{0%{box-shadow:0 0 0 0 rgba(47,139,75,.45)}
  70%{box-shadow:0 0 0 7px rgba(47,139,75,0)}
  100%{box-shadow:0 0 0 0 rgba(47,139,75,0)}}

.punkte{display:flex;gap:7px;margin-bottom:26px}
.punkte b{height:5px;flex:1;border-radius:99px;background:var(--rand);transition:background .45s ease}
.punkte b.an{background:linear-gradient(90deg,#F3B95F,#67C08A)}

.frage{
  margin:0 0 22px;font-size:1.32rem;line-height:1.42;
  font-weight:600;letter-spacing:-.01em;
}
.antworten{display:flex;flex-direction:column;gap:13px}
.antwort{
  display:block;width:100%;text-align:left;
  padding:18px 19px;border-radius:15px;
  font:inherit;font-size:1.05rem;font-weight:500;line-height:1.35;
  cursor:pointer;
  border:1.5px solid var(--ton1r);background:var(--ton1);color:var(--ton1t);
  transition:transform .14s ease, box-shadow .2s ease, opacity .3s ease;
}
.antwort:nth-child(3n+2){border-color:var(--ton2r);background:var(--ton2);color:var(--ton2t)}
.antwort:nth-child(3n+3){border-color:var(--ton3r);background:var(--ton3);color:var(--ton3t)}
.antwort:hover{transform:translateY(-1px);box-shadow:0 6px 16px -6px rgba(60,40,20,.28)}
.antwort:active{transform:scale(.985)}
.antwort:focus-visible{outline:3px solid #67C08A;outline-offset:2px}
.antwort[disabled]{cursor:default}
.antwort.weg{opacity:0;transform:translateY(-6px);pointer-events:none;
  max-height:0;padding-top:0;padding-bottom:0;margin:0;border-width:0;overflow:hidden;
  transition:all .32s ease}
.antwort.gewaehlt{border-color:currentColor}

.rueck{
  margin-top:22px;padding:16px 18px;border-radius:14px;
  font-size:1.05rem;font-weight:600;text-align:center;
  animation:auf .32s ease both;
}
.rueck.gut{background:var(--gutbg);border:1px solid var(--gutr);color:var(--gut)}
.rueck.schlecht{background:var(--schlechtbg);border:1px solid var(--schlechtr);color:var(--schlecht)}

.buehne{position:relative;height:0;transition:height .3s ease}
.buehne.zeigen{height:124px}
.ei{
  position:absolute;left:50%;top:14px;width:56px;height:73px;margin-left:-28px;
  border-radius:50% 50% 50% 50% / 62% 62% 40% 40%;
  background:radial-gradient(ellipse at 34% 26%, #FFFDF8 0%, #FDF0D4 42%, #F0C782 100%);
  box-shadow:0 12px 22px -8px rgba(120,80,20,.5), inset -5px -7px 14px rgba(190,140,60,.35);
  animation:eifall .7s cubic-bezier(.3,1.5,.5,1) both, wackeln 2.6s 0.7s ease-in-out infinite;
}
@keyframes eifall{from{opacity:0;transform:translateY(-34px) scale(.8)}to{opacity:1;transform:none}}
@keyframes wackeln{0%,100%{transform:rotate(-7deg)}50%{transform:rotate(7deg)}}
.funke{position:absolute;left:50%;top:46px;width:7px;height:7px;border-radius:50%;
  opacity:0;animation:funke .95s ease-out forwards}
@keyframes funke{0%{opacity:1;transform:translate(0,0) scale(1)}
  100%{opacity:0;transform:translate(var(--x),var(--y)) scale(.3)}}

.weiter{
  display:none;width:100%;margin-top:20px;padding:17px;
  border:0;border-radius:15px;font:inherit;font-size:1.05rem;font-weight:600;
  color:#fff;background:linear-gradient(135deg,#59B97A,#3C9A5E);
  box-shadow:0 8px 18px -8px rgba(40,120,70,.7);cursor:pointer;
  transition:transform .14s ease,filter .2s ease;
}
.weiter:hover{filter:brightness(1.05)}
.weiter:active{transform:scale(.985)}
.weiter.ruhig{background:linear-gradient(135deg,#9B9A93,#7C7B75);box-shadow:none}

.ende{display:none;text-align:center;padding:14px 4px 4px}
.ende .gross{font-size:1.16rem;font-weight:650;margin-bottom:6px}
.ende p{margin:0;color:var(--leise);font-size:.92rem;line-height:1.5}

.sperre{display:none;margin-top:20px;padding-top:18px;border-top:1px solid var(--rand)}
.sperre label{display:block;font-size:.86rem;color:var(--leise);margin-bottom:7px}
.sperre input{
  width:100%;padding:13px 14px;border-radius:13px;border:1.5px solid var(--rand);
  background:transparent;color:var(--text);font:inherit;font-size:1rem;
}
.sperre input:focus{outline:none;border-color:#67C08A}
.sperre button{
  width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;
  font:inherit;font-size:1rem;font-weight:600;color:var(--text);
  background:var(--rand);cursor:pointer;
}
.fuss{max-width:440px;margin:72px auto 48px;text-align:center;
  font-size:.86rem;color:var(--leise);opacity:.9;position:relative;z-index:1}
.verborgen{display:none !important}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>
<body>
<div class="blasen" aria-hidden="true"><i></i><i></i><i></i></div>

<main class="karte">
  <div class="kopf">
    <svg width="34" height="42" viewBox="0 0 26 32" aria-hidden="true">
      <defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#FFF6E2"/><stop offset="1" stop-color="#EFBE72"/>
      </linearGradient></defs>
      <path d="M13 1C7 1 1 12.5 1 20a12 12 0 0 0 24 0C25 12.5 19 1 13 1z" fill="url(#g)" stroke="#E0A951" stroke-width="1.3"/>
    </svg>
    <h1>Barbaras Eili&#8209;Automat</h1>
  </div>
  <p class="unter">Beantworte die Frage richtig, dann kommt ein Ei heraus.</p>
  <div class="status" id="status"><i></i><span>Verbindung wird aufgebaut …</span></div>

  <div class="punkte" id="punkte" aria-hidden="true"><b></b><b></b></div>

  <p class="frage" id="question">Frage wird geladen …</p>
  <div class="antworten" id="answers"></div>

  <div id="feedback"></div>
  <div class="buehne" id="buehne"></div>

  <button class="weiter" id="nextBtn">Nächste Frage</button>

  <div class="ende" id="endScreen">
    <div class="gross">Geschafft!</div>
    <p>Du hast das Quiz abgeschlossen. In zehn Minuten geht es wieder los.</p>
  </div>

  <div class="sperre" id="banCode">
    <label for="unlockInput">Freischalt-Code</label>
    <input type="password" id="unlockInput" inputmode="numeric" autocomplete="off" placeholder="••••">
    <button id="unlockBtn">Entsperren</button>
    <div id="unlockFeedback"></div>
  </div>

</main>

<p class="fuss">Viel Spass</p>

<script src="https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js"></script>
<script>
  // ---- Verbindung zum Briefkasten ----
  // Der Zugang darf nur senden und nur auf diesem einen Thema.
  const MQTT_URL  = "wss://86ae572d42284233bd7539337359eecd.s1.eu.hivemq.cloud:8884/mqtt";
  const MQTT_USER = "seite";
  const MQTT_PASS = "eili2026quiz";
  const THEMA     = "eili/automat1/ausgabe";
  const THEMA_ST  = "eili/automat1/status";
  const THEMA_QU  = "eili/automat1/quittung";

  let briefkasten = null;
  try {
    briefkasten = mqtt.connect(MQTT_URL, {
      username: MQTT_USER, password: MQTT_PASS,
      clientId: "seite-" + Math.random().toString(16).slice(2, 10),
      connectTimeout: 10000, reconnectPeriod: 2000
    });
    briefkasten.on("connect", () => {
      console.log("Briefkasten verbunden");
      briefkasten.subscribe([THEMA_ST, THEMA_QU], { qos: 1 });
      statusSetzen("", "Automat wird gesucht …");
    });
    briefkasten.on("message", (thema, inhalt) => {
      if (thema === THEMA_ST) {
        let online = false;
        try { online = !!JSON.parse(inhalt.toString()).online; } catch (e) {}
        statusSetzen(online ? "bereit" : "weg",
                     online ? "Automat bereit" : "Automat nicht erreichbar");
      } else if (thema === THEMA_QU) {
        quittungErhalten = true;
      }
    });
    briefkasten.on("close", () => statusSetzen("weg", "Keine Verbindung"));
    briefkasten.on("error", (e) => {
      console.log("Briefkasten-Fehler:", e && e.message);
      statusSetzen("weg", "Keine Verbindung");
    });
  } catch (e) {
    console.log("Briefkasten nicht erreichbar:", e);
  }

  const statusEl = document.getElementById("status");
  let quittungErhalten = false;

  function statusSetzen(art, text) {
    statusEl.className = "status" + (art ? " " + art : "");
    statusEl.querySelector("span").textContent = text;
  }

  function loeseEiAus() {
    if (briefkasten && briefkasten.connected) {
      briefkasten.publish(THEMA, JSON.stringify({ zeit: Date.now() }), { qos: 1 });
      console.log("Ei ausgeloest");
    } else {
      console.log("Briefkasten nicht verbunden, kein Ei ausgeloest");
    }
  }

  // ---- Quiz ----
  let remaining = [];
  let askedCount = 0;
  const maxAsks = 2;
  const banCode = "8180";

  const questionEl  = document.getElementById("question");
  const answersEl   = document.getElementById("answers");
  const feedbackEl  = document.getElementById("feedback");
  const buehneEl    = document.getElementById("buehne");
  const punkteEl    = document.getElementById("punkte");
  const nextBtn     = document.getElementById("nextBtn");
  const endScreen   = document.getElementById("endScreen");
  const banCodeDiv  = document.getElementById("banCode");
  const unlockInput = document.getElementById("unlockInput");
  const unlockBtn   = document.getElementById("unlockBtn");
  const unlockFb    = document.getElementById("unlockFeedback");

  function punkteSetzen(n) {
    const bs = punkteEl.querySelectorAll("b");
    bs.forEach((b, i) => b.classList.toggle("an", i < n));
  }

  function shuffleAnswers(q) {
    const opts = q.a.map((text, idx) => ({ text, idx }));
    for (let i = opts.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [opts[i], opts[j]] = [opts[j], opts[i]];
    }
    return opts;
  }

  function buehneLeeren() {
    buehneEl.classList.remove("zeigen");
    buehneEl.innerHTML = "";
  }

  function eiZeigen() {
    buehneEl.innerHTML = "";
    buehneEl.classList.add("zeigen");
    const ei = document.createElement("div");
    ei.className = "ei";
    buehneEl.appendChild(ei);
    setTimeout(() => buehneEl.scrollIntoView({ block: "nearest", behavior: "smooth" }), 60);
    const farben = ["#F3B95F", "#67C08A", "#B79BE8", "#EE8C6E", "#6FC3D6"];
    for (let i = 0; i < 10; i++) {
      const f = document.createElement("span");
      f.className = "funke";
      const w = (i / 10) * Math.PI * 2;
      f.style.setProperty("--x", Math.cos(w) * 82 + "px");
      f.style.setProperty("--y", Math.sin(w) * 62 + "px");
      f.style.background = farben[i % farben.length];
      f.style.animationDelay = (i * 22) + "ms";
      buehneEl.appendChild(f);
    }
  }

  function checkBan() {
    const bt = localStorage.getItem("quizBan");
    if (bt && Date.now() < parseInt(bt)) {
      const min = Math.max(1, Math.ceil((parseInt(bt) - Date.now()) / 60000));
      questionEl.textContent = "Noch " + min + (min === 1 ? " Minute" : " Minuten") + " Pause.";
      questionEl.style.display = "block";
      answersEl.innerHTML = "";
      feedbackEl.innerHTML = "";
      buehneLeeren();
      nextBtn.style.display = "none";
      endScreen.style.display = "none";
      banCodeDiv.style.display = "block";
      punkteSetzen(0);
      return true;
    }
    banCodeDiv.style.display = "none";
    return false;
  }

  function loadQuestion() {
    if (checkBan()) return;
    if (askedCount >= maxAsks) {
      endScreen.style.display = "block";
      questionEl.style.display = "none";
      answersEl.style.display  = "none";
      feedbackEl.innerHTML = "";
      nextBtn.style.display = "none";
      buehneLeeren();
      localStorage.setItem("quizBan", Date.now() + 10 * 60 * 1000);
      return;
    }
    questionEl.style.display = "block";
    answersEl.style.display  = "flex";
    nextBtn.style.display    = "none";
    endScreen.style.display  = "none";
    feedbackEl.innerHTML     = "";
    buehneLeeren();

    const idx = Math.floor(Math.random() * remaining.length);
    const qObj = remaining.splice(idx, 1)[0];
    askedCount++;
    punkteSetzen(askedCount);
    questionEl.textContent = qObj.q;
    answersEl.innerHTML = "";

    shuffleAnswers(qObj).forEach((opt, i) => {
      const btn = document.createElement("button");
      btn.className = "antwort";
      btn.textContent = opt.text;
      btn.style.animation = "auf .4s " + (i * 60 + 60) + "ms cubic-bezier(.2,.7,.3,1) both";
      btn.onclick = () => handleAnswer(opt.idx === qObj.correct, btn);
      answersEl.appendChild(btn);
    });
  }

  function handleAnswer(isCorrect, selectedBtn) {
    document.querySelectorAll(".antwort").forEach(b => {
      b.disabled = true;
      if (b !== selectedBtn) b.classList.add("weg");
      else b.classList.add("gewaehlt");
    });

    if (isCorrect) {
      feedbackEl.innerHTML = '<div class="rueck gut">Richtig! Dein Ei kommt.</div>';
      eiZeigen();
      quittungErhalten = false;
      loeseEiAus();
      // Ein einziger Zeitgeber. Erst wenn das Ei durch ist, wird geprueft, ob
      // der Automat quittiert hat. Sonst blitzt die Warnung auf, waehrend die
      // Quittung noch unterwegs ist.
      setTimeout(() => {
        buehneLeeren();
        const stumm = !quittungErhalten;
        feedbackEl.innerHTML = stumm
          ? '<div class="rueck schlecht">Der Automat hat nicht geantwortet.</div>'
          : "";
        if (askedCount < maxAsks) {
          nextBtn.textContent = "Nächste Frage";
          nextBtn.className = "weiter";
          nextBtn.style.display = "block";
        } else {
          setTimeout(loadQuestion, stumm ? 3500 : 0);
        }
      }, 6000);
    } else {
      feedbackEl.innerHTML = '<div class="rueck schlecht">Leider falsch.</div>';
      nextBtn.textContent = "Versuche es in 10 Minuten erneut";
      nextBtn.className = "weiter ruhig";
      nextBtn.style.display = "block";
      localStorage.setItem("quizBan", Date.now() + 10 * 60 * 1000);
    }
  }

  nextBtn.onclick = () => {
    if (!nextBtn.textContent.includes("Versuche")) {
      nextBtn.style.display = "none";
      loadQuestion();
    } else {
      checkBan();
    }
  };

  unlockBtn.onclick = () => {
    if (unlockInput.value === banCode) {
      localStorage.removeItem("quizBan");
      location.reload();
    } else {
      unlockFb.innerHTML = '<div class="rueck schlecht">Falscher Code.</div>';
    }
  };

  async function initQuiz() {
    try {
      const response = await fetch("https://gist.githubusercontent.com/barbara-ei/07394dd8905bf79e1a84bec3432d9a5c/raw/gistfile1.txt");
      const data = await response.json();
      remaining = Array.isArray(data) ? [...data] : (data.questions ? [...data.questions] : []);
      if (remaining.length > 0) loadQuestion();
      else questionEl.textContent = "Keine Fragen gefunden.";
    } catch (error) {
      questionEl.textContent = "Die Fragen liessen sich nicht laden. Bitte Internetverbindung prüfen.";
    }
  }

  initQuiz();
</script>
</body>
</html>
